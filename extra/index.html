<style>
:root{
  --kakao-yellow:#FEE500;
  --kakao-yellow-dk:#F0D800;
  --kakao-brown:#3C1E1E;
  --chat-bg:#B2C7D9;
  --bubble-in:#FFFFFF;
  --bubble-out:#FEE500;
  --list-bg:#FFFFFF;
  --line:#EDEDED;
  --sub:#8C8C8C;
  --ink:#1A1A1A;
  --ok:#0B8A3D;
  --ok-bg:#EAF7EF;
  --no:#D93025;
  --no-bg:#FDECEA;
  --lv2:#F5F7FA;
  --lv3:#FBF6EC;
  --page:#EDEDED;
  --soft:#F6F7F8;
  --blue:#355E9D;
  --violet:#7557A5;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--page);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--list-bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 24px rgba(0,0,0,.08)}

/* header */
.hd{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top)}
.hd h1{font-size:19px;font-weight:850;margin:0;letter-spacing:-.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .back{width:34px;height:34px;margin-left:-6px;border:0;background:none;font-size:24px;color:var(--ink);padding:0;display:grid;place-items:center}
.hd .right{margin-left:auto;font-size:12px;color:#5D5D5D;font-weight:850;border-radius:999px;background:#F4F4F4;padding:6px 10px;white-space:nowrap}
.pg{height:3px;background:#E3E5E8;flex:0 0 3px}.pg i{display:block;height:100%;background:var(--kakao-yellow);transition:width .3s}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(60px + env(safe-area-inset-bottom))}

/* chat */
.chatbg{min-height:100%;background:var(--chat-bg);padding:16px 14px 34px}
.session-note{margin:0 0 14px 49px;max-width:86%;font-size:12px;line-height:1.58;color:#314651;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.55);border-radius:12px;padding:9px 11px}
.who{font-size:13px;color:#30434D;margin:0 0 5px 49px;font-weight:750}
.row{display:flex;margin-bottom:13px;align-items:flex-end;gap:9px}.row.me{justify-content:flex-end}
.av{width:40px;height:40px;border-radius:14px;background:var(--kakao-brown);color:var(--kakao-yellow);flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
.bub{max-width:82%;background:var(--bubble-in);border-radius:4px 16px 16px 16px;padding:14px 15px;font-size:16.5px;line-height:1.72;letter-spacing:-.32px;box-shadow:0 1px 1px rgba(0,0,0,.05);word-break:keep-all}
.row.me .bub{background:var(--bubble-out);border-radius:16px 4px 16px 16px}.tm{font-size:11px;color:#42535E;align-self:flex-end;padding-bottom:2px}
.qmeta{font-size:12.5px;color:#7E6200;font-weight:850;margin-bottom:6px}.qmeta .dif{color:#445661;margin-left:6px}

/* options */
.opts{margin:4px 0 0 49px;display:flex;flex-direction:column;gap:9px;max-width:86%}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid #fff;border-radius:15px;padding:14px 15px;font-size:16.5px;line-height:1.62;letter-spacing:-.3px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);word-break:keep-all;min-height:64px}
.opt:active{transform:scale(.985)}
.opt .n{flex:0 0 28px;height:28px;border-radius:50%;background:#EDEFF2;color:#5A6470;font-size:14px;font-weight:850;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.chosen{border-color:#756B59;background:#FFFDF2}.opt.chosen .n{background:var(--kakao-yellow);color:var(--kakao-brown)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .n{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-bg)}.opt.no .n{background:var(--no);color:#fff}
.opt[disabled]{cursor:default;opacity:1}.opt.dim{opacity:.52}

/* explanation */
.exp{margin:6px 0 0 49px;max-width:90%;background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 8px 22px rgba(38,53,65,.12);border:1px solid rgba(0,0,0,.04);scroll-margin-top:72px}
.vd{padding:14px 16px;border-bottom:1px solid var(--line)}.vd.o{background:var(--ok-bg)}.vd.x{background:var(--no-bg)}
.vd b{font-size:17px;letter-spacing:-.3px}.vd .a{font-size:14px;color:#444;margin-top:5px;line-height:1.6}
.l1{padding:15px 16px;font-size:16px;line-height:1.78;letter-spacing:-.28px;word-break:keep-all}
.l1 .tag{display:inline-block;font-size:12px;font-weight:900;color:#725D00;background:var(--kakao-yellow);border-radius:6px;padding:4px 8px;margin-right:8px;vertical-align:1px}
details{border-top:1px solid var(--line)}
.exp-guide{padding:13px 16px;background:linear-gradient(180deg,#FFF9D8 0%,#FFFDF0 100%);border-bottom:1px solid #F0E5A1;font-size:14px;line-height:1.65;color:#4A3B00}.exp-guide b{font-size:15px;color:#2D2A22}.exp-guide .tip{display:inline-block;margin-bottom:6px;background:#3C1E1E;color:#FEE500;border-radius:999px;padding:3px 8px;font-size:11.5px;font-weight:900;letter-spacing:-.2px}
summary{padding:15px 16px;font-size:16px;font-weight:900;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;letter-spacing:-.25px;color:#1F2D36;min-height:58px} summary .sum-main{display:flex;align-items:center;gap:8px} summary .sum-tip{margin-left:auto;margin-right:10px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 8px;font-size:11.5px;font-weight:900;color:#5A4B00;white-space:nowrap}
summary::-webkit-details-marker{display:none}summary::after{content:"▾";font-size:14px;color:#5D6972;transition:transform .18s}details[open] summary::after{transform:rotate(180deg)}
details .c{padding:0 16px 16px;font-size:15px;line-height:1.84;letter-spacing:-.24px;word-break:keep-all}details.d2{background:#F3F7FB}details.d3{background:#FBF6EC}details.d2 summary{border-left:6px solid #84A9D8}details.d3 summary{border-left:6px solid #E0B83C}details[open]{box-shadow:inset 0 1px 0 rgba(255,255,255,.6)} .l1 b,.l1 strong,details .c b,details .c strong{background:linear-gradient(transparent 55%,rgba(254,229,0,.58) 55%)}
.law{background:#fff;border:1px solid #E5DCC8;border-left:4px solid var(--kakao-yellow);border-radius:10px;padding:12px 13px;margin:10px 0;font-size:14.5px;line-height:1.78}.law .src{font-size:12px;font-weight:900;color:#8A6D00;display:block;margin-bottom:6px;letter-spacing:-.15px}
.law.decree{border-left-color:var(--blue)}.law.rule{border-left-color:var(--violet)}
.mini{font-size:12px;color:#666;margin-top:10px;line-height:1.62}

/* rating */
.acts{margin:12px 0 4px 49px;display:flex;gap:8px;max-width:90%}.btn{flex:1;border:0;border-radius:14px;padding:15px 8px;font-size:14.5px;font-weight:850;color:#222;min-height:50px}.btn:active{transform:scale(.97)}
.b-again{background:#FFE5E3;color:#C62B1D}.b-hard{background:#FFF1CC;color:#8D6E00}.b-good{background:#E9F3FF;color:#315E9F}.b-easy{background:#E1F3E8;color:#0B6B31}.b-y{background:var(--kakao-yellow);color:var(--kakao-brown)}.b-dark{background:var(--kakao-brown);color:#fff}.b-g{background:#F1F2F4;color:#333}
.wide{margin:16px 14px;display:block;width:calc(100% - 28px);padding:17px;border-radius:14px;border:0;font-size:16px;font-weight:900;min-height:56px}

/* mock */
.mock-footer{margin:14px 0 0 49px;max-width:86%;display:flex;gap:8px}.mock-footer .btn{min-height:52px}.mock-hint{margin:10px 0 0 49px;max-width:86%;font-size:12px;line-height:1.58;color:#425560}
.mock-review-note{margin:0 0 14px 49px;max-width:86%;background:#FFF8D6;border:1px solid #EBD869;border-radius:13px;padding:11px 12px;font-size:13.5px;line-height:1.65;color:#4B3D00}.mock-review-note b{font-size:14.5px}.mock-review-nav{margin:14px 0 4px 49px;max-width:90%;display:flex;gap:8px}.mock-review-nav .btn{min-height:56px;font-size:15px}.mock-review-score{margin:0 0 12px 49px;max-width:86%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.86);border-radius:13px;padding:10px 12px;font-size:13px;color:#43525C}.mock-review-score strong{font-size:16px;color:var(--kakao-brown)}

/* home/menu */
.profile{background:var(--kakao-yellow);padding:22px 20px 18px;display:flex;align-items:center;gap:15px}.pf-ico{width:58px;height:58px;border-radius:18px;background:var(--kakao-brown);color:var(--kakao-yellow);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex:0 0 58px}.pf-t{font-size:19px;font-weight:850;color:var(--kakao-brown);letter-spacing:-.5px}.pf-s{font-size:13.5px;color:#71563C;margin-top:4px;line-height:1.6}.bar{padding:13px 20px 7px;font-size:13px;font-weight:800;color:#707070}
.menu{list-style:none;margin:0;padding:0}.menu li{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--list-bg)}.menu li:active{background:#F6F6F6}.mi{width:46px;height:46px;border-radius:15px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#F1F2F4}.mi.y{background:var(--kakao-yellow)}.mi.b{background:var(--kakao-brown);color:var(--kakao-yellow)}.mt{font-size:16.5px;font-weight:800;letter-spacing:-.28px}.ms{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.55}.badge{margin-left:auto;background:#FF3B30;color:#fff;font-size:12px;font-weight:800;border-radius:12px;padding:3px 8px;min-width:24px;text-align:center}.badge.g{background:#E9EAEC;color:#666}.badge.y{background:var(--kakao-yellow);color:var(--kakao-brown)}

/* result */
.res{padding:26px 20px 10px;text-align:center}.res .sc{font-size:46px;font-weight:900;letter-spacing:-2px;color:var(--kakao-brown)}.res .sc small{font-size:19px;color:var(--sub);font-weight:750}.res .msg{font-size:14px;color:#555;margin-top:8px;line-height:1.65}.diag{margin:14px 18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.diag-row{display:flex;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}.diag-row:last-child{border-bottom:0}.diag-row strong{color:var(--kakao-brown)}
.review-list{margin:12px 12px 0}.review-item{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}.review-head{padding:12px 13px;display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.5}.review-head .mk{font-weight:900;font-size:15px}.review-head .mk.o{color:var(--ok)}.review-head .mk.x{color:var(--no)}.review-item details .c{background:#FAFAFA}.review-item .exp{margin:0;max-width:none;box-shadow:none;border-radius:0}

/* research / access */
.gate{padding:28px 22px;text-align:center}.gate .lk{font-size:42px}.gate h2{font-size:20px;margin:13px 0 8px;letter-spacing:-.5px}.gate p{font-size:13.5px;color:#555;line-height:1.75;margin:0 0 6px;word-break:keep-all}.gate .lead{font-size:15px;color:#2B2926}.steps{text-align:left;background:#F7F8FA;border-radius:14px;padding:14px 16px;margin:17px 0;font-size:13px;line-height:1.85;color:#333}.steps b{color:var(--kakao-brown)}
.codebox{background:#FFF9D8;border:1px solid #F1DF71;border-radius:13px;padding:12px;margin:13px 0;text-align:left}.codebox .label{font-size:10.5px;color:#776400;font-weight:850}.codebox code{display:block;font-size:18px;letter-spacing:1.7px;font-weight:900;color:var(--kakao-brown);margin-top:4px;word-break:break-all}.code-actions{display:flex;gap:7px;margin-top:8px}.code-actions button{border:0;background:#fff;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800}
.pending-card{background:#F7F8FA;border-radius:14px;padding:14px 15px;text-align:left;margin:16px 0}.pending-card .state{font-size:15px;font-weight:850;margin-bottom:5px}.pending-card p{font-size:12.5px;margin:0;color:#5F5F5F;line-height:1.6}.mail{font-size:12px;color:#555;margin-top:10px;line-height:1.55}.mail a{color:inherit;font-weight:800;text-decoration:none}

/* info */
.info{padding:18px}.info-card{border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:10px;background:#fff}.info-card h3{font-size:14px;margin:0 0 7px}.info-card p,.info-card li{font-size:12.5px;color:#5C5C5C;line-height:1.65}.info-card ul{padding-left:18px;margin:6px 0 0}.small-status{display:inline-block;background:#F2F2F2;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:800;color:#666}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:min(520px,100%);height:66px;display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.98);padding-bottom:env(safe-area-inset-bottom)}.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#9AA0A6;padding:0}.tab .ic{font-size:20px;line-height:1}.tab .lb{font-size:12px;font-weight:800}.tab.on{color:var(--kakao-brown)}

.hidden{display:none!important}.spacer{height:12px}.center-note{text-align:center;color:#666;font-size:12px;line-height:1.65;padding:10px 18px 22px}
.toast{position:fixed;z-index:100;left:50%;bottom:86px;transform:translateX(-50%);width:min(410px,calc(100% - 28px));background:#252525;color:#fff;padding:13px 15px;border-radius:13px;font-size:14px;text-align:center;box-shadow:0 7px 26px rgba(0,0,0,.22)}
.approval-note{background:#EAF7EF;border:1px solid #BFE4CB;border-radius:14px;padding:14px 15px;margin:14px 0;text-align:left}.approval-note strong{display:block;font-size:16px;color:#0B6B31;margin-bottom:5px}.approval-note p{margin:0;font-size:13px;line-height:1.68;color:#405149}
.return-hero{margin:16px 18px 18px;border-radius:20px;padding:18px 16px;box-shadow:0 7px 22px rgba(38,53,65,.12);border:2px solid var(--kakao-yellow);background:#FFFDF0}.return-hero.approved{background:#EDFAF2;border-color:#75C991}.return-hero .hero-kicker{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:var(--kakao-brown);color:var(--kakao-yellow);margin-bottom:8px}.return-hero.approved .hero-kicker{background:#0B8A3D;color:#fff}.return-hero h2{font-size:21px;line-height:1.35;letter-spacing:-.55px;margin:0 0 7px;color:#191919}.return-hero p{font-size:14px;line-height:1.68;color:#4C555B;margin:0 0 12px;word-break:keep-all}.return-hero .hero-btn{display:block;width:100%;border:0;border-radius:14px;min-height:58px;padding:14px 12px;background:var(--kakao-yellow);color:var(--kakao-brown);font-size:17px;font-weight:900;letter-spacing:-.3px}.return-hero.approved .hero-btn{background:#0B8A3D;color:#fff}.return-hero .hero-sub{margin-top:9px;font-size:11.5px;line-height:1.55;color:#68737A}.return-hero .hero-status{margin-top:9px;border-radius:10px;padding:9px 10px;background:rgba(255,255,255,.72);font-size:12.5px;font-weight:800;line-height:1.55;color:#3C1E1E}.return-hero .hero-secondary{display:block;width:100%;border:1px solid #DDD;border-radius:12px;min-height:46px;padding:10px 12px;margin-top:9px;background:#fff;color:#4A4A4A;font-size:13px;font-weight:800}
.post-survey-backdrop{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;justify-content:center;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}.post-survey-modal{width:min(500px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:20px 18px 18px;box-shadow:0 18px 54px rgba(0,0,0,.28)}.post-survey-modal .modal-kicker{display:inline-block;background:var(--kakao-yellow);color:var(--kakao-brown);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;margin-bottom:8px}.post-survey-modal h2{font-size:21px;line-height:1.35;letter-spacing:-.5px;margin:0 0 8px}.post-survey-modal .modal-lead{font-size:15px;line-height:1.7;color:#333;margin:0 0 12px}.post-survey-modal .modal-steps{background:#F7F8FA;border-radius:14px;padding:13px 14px;margin:12px 0;font-size:13.5px;line-height:1.78;color:#333}.post-survey-modal .modal-steps b{color:var(--kakao-brown)}.post-survey-modal .modal-warn{background:#FFF9D8;border:1px solid #F1DF71;border-radius:12px;padding:11px 12px;font-size:12.5px;line-height:1.65;color:#5C5100;margin:12px 0}.post-survey-modal .wide{margin:12px 0 0;width:100%}@media (min-width:700px){.post-survey-backdrop{align-items:center}}

/* v4: ANKI 선택을 '다음 문제로 가는 동작'으로 재설계 */
.next-step{
  margin:15px 0 6px 49px;max-width:90%;background:rgba(255,255,255,.98);
  border:2px solid var(--kakao-yellow);border-radius:17px;padding:14px;
  box-shadow:0 5px 18px rgba(38,53,65,.14);position:relative;overflow:hidden
}
.next-step::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--kakao-yellow)}
.next-step-head{padding:2px 2px 10px}
.next-kicker{display:inline-block;background:var(--kakao-yellow);color:var(--kakao-brown);border-radius:999px;padding:5px 9px;font-size:11.5px;font-weight:900;margin-bottom:8px}
.next-step-head strong{display:block;font-size:16.5px;line-height:1.45;letter-spacing:-.35px;color:#202020}
.next-step-head p{margin:5px 0 0;font-size:12.5px;line-height:1.58;color:#5C6870}
.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.memory-btn{
  position:relative;min-height:74px;border:0;border-radius:14px;padding:11px 30px 10px 12px;

.memory-btn:active{transform:scale(.975)}
.memory-btn .rate-word{font-size:15.5px;font-weight:900;line-height:1.2;letter-spacing:-.2px}

.memory-btn.picked{box-shadow:inset 0 0 0 3px currentColor,0 2px 8px rgba(0,0,0,.09);transform:scale(.985)}
.memory-btn:disabled:not(.picked){opacity:.42}

.rate-guide b{color:#2D363B}

.rate-status:not(:empty){min-height:18px;margin-top:8px;background:#FFF9D3;border-radius:9px;padding:7px 8px}

function readSurveyStage(){
  try{
    const v=String(localStorage.getItem(SURVEY_STAGE_KEY)||'').toLowerCase();
    if(v==='opened'||v==='submitted') return v;
  }catch(e){}
  return 'none';
}
function writeSurveyStage(stage){
  const v=(stage==='opened'||stage==='submitted')?stage:'none';
  try{
    if(v==='none') localStorage.removeItem(SURVEY_STAGE_KEY);
    else localStorage.setItem(SURVEY_STAGE_KEY,v);
    localStorage.removeItem(PENDING_KEY);
  }catch(e){}
  if(typeof state!=='undefined'){
    state.surveyStage=v;

  }

    const raw=localStorage.getItem(ENTITLEMENT_KEY);

    const data=JSON.parse(raw)||{};

    if(!/^MG-[A-Z2-9]{4}-[A-Z2-9]{4}(?:-[A-Z2-9]{4})?$/.test(code)){
      localStorage.removeItem(ENTITLEMENT_KEY);
      return null;
    }
    data.code=code;
    return data;
  }catch(e){ return null; }
}

function readTrialStatus(){
  try{
    const raw=localStorage.getItem(TRIAL_STATUS_KEY);
    if(!raw) return {studyCompleted:false,mockCompleted:false};

  }catch(e){ return {studyCompleted:false,mockCompleted:false}; }
}

function loadTrialStudyProgress(){
  try{
    const raw=localStorage.getItem(TRIAL_STUDY_PROGRESS_KEY); if(!raw) return null;
    const d=JSON.parse(raw); if(!d || !Array.isArray(d.queue) || !Number.isInteger(d.index)) return null;
    const queue=d.queue.map(x=>{
      if(!x || !x.baseId) return null;
      if(x.isReview) return makeReviewItem(x.baseId);
      const q=TRIAL_STUDY.find(v=>v.id===x.baseId);
      return q?{baseId:q.id,question:q,isReview:false}:null;
    }).filter(Boolean);
    if(!queue.length || d.index<0 || d.index>=queue.length) return null;
    return {queue,index:d.index,answered:false,selected:null,repeatCount:d.repeatCount||{},totalCore:TRIAL_STUDY.length,coreFinished:Math.max(0,Math.min(TRIAL_STUDY.length,Number(d.coreFinished)||0)),correct:Number(d.correct)||0,wrong:Number(d.wrong)||0,transitioning:false};
  }catch(e){ return null; }
}
function saveTrialStudyProgress(){
  try{
    const s=state.study; if(!s) return;
    const d={queue:s.queue.map(x=>({baseId:x.baseId,isReview:!!x.isReview})),index:s.index,repeatCount:s.repeatCount||{},coreFinished:s.coreFinished||0,correct:s.correct||0,wrong:s.wrong||0};
    localStorage.setItem(TRIAL_STUDY_PROGRESS_KEY,JSON.stringify(d));

}
function clearTrialStudyProgress(){ try{ localStorage.removeItem(TRIAL_STUDY_PROGRESS_KEY); }catch(e){} }
function loadTrialMockProgress(){
  try{
    const raw=localStorage.getItem(TRIAL_MOCK_PROGRESS_KEY); if(!raw) return null;
    const d=JSON.parse(raw); if(!d || !Array.isArray(d.answers) || d.answers.length!==TRIAL_MOCK.length) return null;
    const answers=d.answers.map(v=>(v===null||v===undefined)?null:Number(v));
    if(answers.some(v=>v!==null && (!Number.isInteger(v)||v<0||v>3))) return null;
    return {index:Math.max(0,Math.min(TRIAL_MOCK.length-1,Number(d.index)||0)),answers,submitted:!!d.submitted,reviewIndex:Math.max(0,Math.min(TRIAL_MOCK.length,Number(d.reviewIndex)||0)),reviewDone:!!d.reviewDone};
  }catch(e){ return null; }
}
function saveTrialMockProgress(){
  try{
    const m=state.mock; if(!m) return;
    localStorage.setItem(TRIAL_MOCK_PROGRESS_KEY,JSON.stringify({index:m.index,answers:m.answers,submitted:!!m.submitted,reviewIndex:m.reviewIndex||0,reviewDone:!!m.reviewDone}));
  }catch(e){}
}
function clearTrialMockProgress(){ try{ localStorage.removeItem(TRIAL_MOCK_PROGRESS_KEY); }catch(e){} }

}

  const m=(state && state.mock)||loadTrialMockProgress();
  return m&&Array.isArray(m.answers)?m.answers.filter(v=>v!==null).length:0;
}
function trialMockHomeText(){
  const m=(state && state.mock)||loadTrialMockProgress();

    if(m && m.submitted && !m.reviewDone) return `${TRIAL_MOCK.length}문항 답안 제출 완료 · 해설 이어보기`;
    return `${TRIAL_MOCK.length}문항 완료 · 다시보기 가능`;
  }
  const n=trialMockAnsweredCount();
  return n>0?`${n}/${TRIAL_MOCK.length} 답변 저장 · 이어서 응시`:`${TRIAL_MOCK.length}문항 · 시험 종료 후 정답과 상세해설`;
}

}

function ensureAccessCode(){
  if(state.accessCode) return state.accessCode;
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const block=()=>Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  // 사용자가 직접 입력하지 않는 내부 연결값. v7부터 충돌/추측 가능성을 더 낮추기 위해 12자리 사용.
  state.accessCode=`MG-${block()}-${block()}-${block()}`;
  try{ localStorage.setItem(ACCESS_CODE_KEY,state.accessCode); }catch(e){}
  return state.accessCode;
}
function ensureDeviceSecret(){
  try{
    let v=localStorage.getItem(DEVICE_SECRET_KEY)||'';
    if(/^[a-f0-9]{64}$/i.test(v)) return v.toLowerCase();
    const bytes=new Uint8Array(32);
    crypto.getRandomValues(bytes);
    v=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
    localStorage.setItem(DEVICE_SECRET_KEY,v);
    return v;
  }catch(e){
    // localStorage 사용이 막힌 환경에서는 세션 내 임시값을 사용하되 이용권 유지가 제한될 수 있다.
    if(!state._tempDeviceSecret){
      const chars='abcdef0123456789';
      state._tempDeviceSecret=Array.from({length:64},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
    }
    return state._tempDeviceSecret;
  }
}
async function getDeviceHash(){
  const secret=ensureDeviceSecret();
  try{
    if(crypto.subtle && window.TextEncoder){
      const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(secret));
      return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  // secret 자체도 256비트 무작위 값이므로 구형 환경에서는 이를 기기 연결값으로 사용한다.
  return secret.toLowerCase();
}

}

    const raw=localStorage.getItem(BASE_PROGRESS_KEY); if(!raw) return 0;
    const d=JSON.parse(raw); if(!d || d.code!==state.accessCode) return 0;
    const n=Number(d.completed||0); return Number.isFinite(n)?Math.max(0,Math.min(APP_CONFIG.baseQuestionCommitment,n)):0;
  }catch(e){ return 0; }
}
function saveBaseProgress(n){
  try{ localStorage.setItem(BASE_PROGRESS_KEY,JSON.stringify({code:state.accessCode,completed:Math.max(0,Math.min(APP_CONFIG.baseQuestionCommitment,Number(n)||0))})); }catch(e){}
}
function clearBaseProgress(){ try{ localStorage.removeItem(BASE_PROGRESS_KEY); }catch(e){} }
function readBaseHistoryNumbers(){
  const set=new Set();
  const bp=readBaseProgress();
  for(let n=1;n<=bp;n++) set.add(n);
  try{
    const raw=localStorage.getItem(BASE_HISTORY_KEY); if(!raw) return set;
    const d=JSON.parse(raw); if(!d || d.code!==state.accessCode || !Array.isArray(d.numbers)) return set;
    d.numbers.forEach(v=>{ const n=Number(v); if(Number.isInteger(n)&&n>=1&&n<=APP_CONFIG.baseQuestionCommitment) set.add(n); });
  }catch(e){}
  return set;
}
function writeBaseHistoryNumbers(set){
  try{
    const numbers=[...set].filter(n=>Number.isInteger(n)&&n>=1&&n<=APP_CONFIG.baseQuestionCommitment).sort((a,b)=>a-b);
    localStorage.setItem(BASE_HISTORY_KEY,JSON.stringify({code:state.accessCode,numbers}));
  }catch(e){}
}
function markBaseQuestionStudied(n){
  n=Number(n); if(!Number.isInteger(n)||n<1||n>APP_CONFIG.baseQuestionCommitment) return readBaseProgress();
  const set=readBaseHistoryNumbers(); set.add(n); writeBaseHistoryNumbers(set);
  let p=readBaseProgress();
  while(p<APP_CONFIG.baseQuestionCommitment && set.has(p+1)) p++;
  if(p!==readBaseProgress()) saveBaseProgress(p);
  return p;
}
function baseStudiedCount(start=1,end=APP_CONFIG.baseQuestionCommitment){
  const set=readBaseHistoryNumbers(); let c=0;
  for(let n=Math.max(1,start);n<=Math.min(APP_CONFIG.baseQuestionCommitment,end);n++) if(set.has(n)) c++;
  return c;
}
function baseRemainingInRange(start,end){ return Math.max(0,(end-start+1)-baseStudiedCount(start,end)); }


function jsonpApi(action, params={}){
  return new Promise(async (resolve,reject)=>{
    if(!APP_CONFIG.statusEndpoint) return reject(new Error('콘텐츠 서버가 연결되지 않았습니다.'));
    const cb='__mgApi_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    let timer;
    window[cb]=(data)=>{
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      const el=document.getElementById(cb); if(el) el.remove();
      resolve(data||{});
    };
    try{
      const deviceHash=await getDeviceHash();
      const u=new URL(APP_CONFIG.statusEndpoint);
      u.searchParams.set('action',action);
      u.searchParams.set('code',ensureAccessCode());
      u.searchParams.set('device',deviceHash);
      Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,String(v)));
      u.searchParams.set('callback',cb);
      u.searchParams.set('_',Date.now());
      const sc=document.createElement('script');
      sc.id=cb; sc.src=u.toString();
      sc.onerror=()=>{clearTimeout(timer);try{delete window[cb]}catch(e){};sc.remove();reject(new Error('서버 연결에 실패했습니다.'));};
      timer=setTimeout(()=>{try{delete window[cb]}catch(e){};sc.remove();reject(new Error('서버 응답이 지연되고 있습니다.'));},15000);
      document.body.appendChild(sc);
    }catch(e){ reject(e); }
  });
}

async function registerFree100Completion(force=false){
  if(!free100Completed()) throw new Error('무료 100문항을 모두 완료한 뒤 진행해 주세요.');
  if(!force){
    try{ if(localStorage.getItem(FREE100_REGISTERED_KEY)==='1') return {status:'FREE100_COMPLETE'}; }catch(e){}
  }
  const r=await jsonpApi('registerFree100');
  const st=String(r.status||'').toUpperCase();
  if(['FREE100_COMPLETE','SURVEY_REQUIRED','APPROVED'].includes(st)){
    try{ localStorage.setItem(FREE100_REGISTERED_KEY,'1'); }catch(e){}
    if(st==='APPROVED') handleAccessStatus(r);
    return r;
  }
  throw accessError(r);
}

function accessStatusMessage(data={}){
  const status=String(data.status||'').toUpperCase();
  if(status==='DEVICE_MISMATCH') return '추가 학습은 무료 100문항을 완료하고 설문을 제출한 동일 기기·브라우저에서만 이용할 수 있습니다.';
  if(status==='FREE100_REQUIRED') return '무료 기본학습 50문항과 미니 모의고사 50문항을 모두 완료한 뒤 설문에 참여해 주세요.';
  if(status==='SURVEY_REQUIRED') return '무료 100문항 완료는 확인되었습니다. 추가 문제가 필요하시면 생성형 AI 연구 설문을 제출해 주세요.';
  if(status==='DEVICE_REQUIRED') return '브라우저 확인정보를 만들 수 없습니다. 시크릿 모드가 아닌 일반 브라우저에서 이용해 주세요.';
  if(status==='BUSY') return '확인 요청이 겹쳤습니다. 잠시 후 다시 시도해 주세요.';
  if(status==='NOT_FOUND') return '이 브라우저의 추가학습 이용기록을 찾지 못했습니다. 무료 100문항을 완료한 동일 브라우저인지 확인해 주세요.';
  return data.message || '추가학습 상태를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.';
}
function applyAccessFailure(data={}){
  const status=String(data.status||'').toUpperCase();
  state.accessState=status;
  state.entitlement=null;
  try{ localStorage.removeItem(ENTITLEMENT_KEY); }catch(e){}
  state.homeStatus=accessStatusMessage(data);
}
function accessError(data={}){
  applyAccessFailure(data);
  const e=new Error(accessStatusMessage(data));
  e.status=String(data.status||'').toUpperCase();
  return e;
}
function storeApprovedEntitlement(data={}){
  const ent={code:String(data.code||ensureAccessCode()).trim().toUpperCase(),enabledAt:data.enabledAt||data.surveySubmittedAt||new Date().toISOString()};
  state.entitlement=ent;
  state.accessCode=ent.code;
  state.accessState='APPROVED';
  state.homeStatus='설문 제출이 확인되었습니다. 추가 100문항이 자동으로 열렸습니다.';
  markSurveySubmittedVerified();
  try{
    localStorage.setItem(ACCESS_CODE_KEY,ent.code);
    localStorage.setItem(ENTITLEMENT_KEY,JSON.stringify(ent));
  }catch(e){}
  return ent;
}
function handleAccessStatus(data={}){
  const status=String(data.status||'').toUpperCase();
  if(status==='APPROVED'){ storeApprovedEntitlement(data); return {approved:true,status}; }
  applyAccessFailure(data);
  return {approved:false,status};
}

function makeReviewItem(baseId){
  const base=TRIAL_STUDY.find(q=>q.id===baseId);
  if(!base) return null;
  const rv=REVIEW_VARIANTS[baseId];
  if(rv) return {baseId, isReview:true, question:{...base,...rv,id:`${baseId}-R`,step2:base.step2,sources:base.sources}};
  // 별도 변형문항이 없는 무료 학습문항도 선택지 순서를 바꿔 실제 복습되도록 한다.
  const shift=((Number(String(baseId).replace(/\D/g,''))||1)%3)+1;
  const options=base.options.slice(shift).concat(base.options.slice(0,shift));
  const answer=(base.answer-shift+base.options.length)%base.options.length;
  return {baseId,isReview:true,question:{...base,id:`${baseId}-R`,question:`복습 확인 · ${base.question}`,options,answer}};
}
function insertReview(baseId,offset){
  const s=state.study;
  const used=s.repeatCount[baseId]||0;
  if(used>=2) return;
  const item=makeReviewItem(baseId); if(!item) return;
  s.repeatCount[baseId]=used+1;
  const pos=Math.min(s.queue.length,s.index+Math.max(1,offset));
  s.queue.splice(pos,0,item);
}

function rateStudy(rate,button){
  const s=state.study, item=currentStudyItem();
  if(s.transitioning) return;
  s.transitioning=true;
  const panel=button && button.closest('.next-step');
  if(panel){
    panel.querySelectorAll('[data-rate]').forEach(b=>{ b.disabled=true; b.classList.toggle('picked',b===button); });
    const msg={
      again:'같은 개념을 2문제 뒤 다시 보여드릴게요.',
      hard:'같은 개념을 약 5문제 뒤 다시 확인합니다.',
      good:'이해한 것으로 보고 다음 문제로 이동합니다.',
      easy:'충분히 익힌 것으로 보고 다음 문제로 이동합니다.'
    }[rate];
    const status=panel.querySelector('.rate-status');
    if(status) status.textContent=msg+'  다음 문제로 이동 중…';
  }
  window.setTimeout(()=>{
    if(rate==='again') insertReview(item.baseId,3);
    if(rate==='hard') insertReview(item.baseId,6);
    s.index++; s.answered=false; s.selected=null; s.transitioning=false;
    if(!item.isReview && s.coreFinished>=TRIAL_STUDY.length){
      state.trial.studyCompleted=true; writeTrialStatus(state.trial); clearTrialStudyProgress();
      return studyEndView();
    }
    if(s.index>=s.queue.length){

/* ---------- mock ---------- */
function newMockSession(force=false){
  if(!force){
    const saved=loadTrialMockProgress();
    if(saved){ state.mock=saved; return; }
  }
  state.mock={index:0,answers:Array(TRIAL_MOCK.length).fill(null),submitted:false,reviewIndex:0,reviewDone:false};
  saveTrialMockProgress();
}
function mockView(){
  setTab('exam');
  if(!state.mock){ newMockSession(); }
  if(state.mock.submitted){
    return state.mock.reviewDone ? mockResultView() : mockReviewView();
  }
  const m=state.mock, q=TRIAL_MOCK[m.index], selected=m.answers[m.index];
  chrome('미니 모의고사',{progress:Math.round(m.index/TRIAL_MOCK.length*100),right:`${m.index+1} / ${TRIAL_MOCK.length}`});
  body.innerHTML=`<div class="chatbg">
    ${m.index===0?`<div class="session-note"><b>실전처럼 먼저 ${TRIAL_MOCK.length}문항을 풉니다.</b> 시험 중에는 정답과 해설을 공개하지 않고, 제출 직후 <b>1번부터 ${TRIAL_MOCK.length}번까지 해설 복습</b>이 자동으로 이어집니다. 응시 위치는 같은 브라우저에서 이어볼 수 있도록 기기 내부에만 저장합니다.</div>`:''}
    ${m.index===Math.floor(TRIAL_MOCK.length/2)?`<div class="session-note"><b>절반 완료 · ${m.index}/${TRIAL_MOCK.length}</b><br>지금부터 ${TRIAL_MOCK.length-m.index}문항 남았습니다. 시험 흐름을 유지해 계속 진행하세요.</div>`:''}
    ${questionBubble(q,m.index+1,TRIAL_MOCK.length,'실전')}
    ${optionsHtml(q,'mock',selected)}
    <div class="mock-footer"><button class="btn b-y" id="mockNext" ${selected===null?'disabled style="opacity:.45"':''}>${m.index===TRIAL_MOCK.length-1?'답안 제출':'다음 문항 →'}</button></div>
    <div class="mock-hint">선택 후 다음 문항으로 이동합니다. 정답·상세해설은 ${TRIAL_MOCK.length}문항 제출 직후 순서대로 확인합니다.</div>
  </div>${renderToast()}`;
  body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>selectMock(+b.dataset.pick));
  const nx=$('#mockNext'); if(nx && selected!==null) nx.onclick=advanceMock;
}
function selectMock(pick){
  state.mock.answers[state.mock.index]=pick;
  saveTrialMockProgress();
  mockView();
}
function advanceMock(){
  const m=state.mock;
  if(m.answers[m.index]===null) return;
  if(m.index<TRIAL_MOCK.length-1){ m.index++; saveTrialMockProgress(); return mockView(); }
  m.submitted=true;
  m.reviewIndex=0;
  m.reviewDone=false;
  state.trial.mockCompleted=true;
  writeTrialStatus(state.trial);
  saveTrialMockProgress();
  // v8.4: 무료 100문항 완주 기준은 '50문항 답안 제출'입니다. 해설 복습은 이어서 자유롭게 확인할 수 있습니다.
  mockReviewView();
}
function categoryStats(){
  const map={};
  TRIAL_MOCK.forEach((q,i)=>{
    const k=q.category; if(!map[k]) map[k]={right:0,total:0};
    map[k].total++; if(state.mock.answers[i]===q.answer) map[k].right++;
  });
  return map;
}
function mockReviewView(){
  setTab('exam');
  const m=state.mock;
  if(!m || !m.submitted) return mockView();
  if(m.reviewIndex>=TRIAL_MOCK.length){ m.reviewDone=true; state.trial.mockCompleted=true; return mockResultView(); }
  const i=m.reviewIndex, q=TRIAL_MOCK[i], pick=m.answers[i], ok=pick===q.answer;
  const right=TRIAL_MOCK.filter((x,j)=>m.answers[j]===x.answer).length;
  chrome('모의고사 해설',{progress:Math.round((i+1)/TRIAL_MOCK.length*100),right:`해설 ${i+1} / ${TRIAL_MOCK.length}`});
  body.innerHTML=`<div class="chatbg">
    ${i===0?'<div class="mock-review-note"><b>지금부터가 핵심 학습입니다.</b><br>정답 번호만 확인하지 말고, 자동으로 펼쳐진 <b>2단계 ‘왜 그런가요?’</b>를 먼저 읽어보세요. 오답 문항은 <b>3단계 법령 근거</b>도 자동으로 펼쳐집니다. 해설 확인 위치도 같은 브라우저에 저장됩니다.</div>':''}
    ${i===Math.floor(TRIAL_MOCK.length/2)?`<div class="mock-review-note"><b>해설 절반 확인 · ${i}/${TRIAL_MOCK.length}</b><br>남은 ${TRIAL_MOCK.length-i}문항도 같은 방식으로 확인하면 무료 모의고사 복습이 완료됩니다.</div>`:''}
    <div class="mock-review-score"><span>채점 결과</span><strong>${right} / ${TRIAL_MOCK.length}</strong><span>${ok?'이번 문항 정답':'이번 문항 오답'}</span></div>
    ${questionBubble(q,i+1,TRIAL_MOCK.length,'해설')}
    ${reviewOptionsHtml(q,pick)}
    <div class="row me"><span class="tm">내 답</span><div class="bub">${pick+1}번</div></div>
    ${explanationHtml(q,pick,{resultOnly:true})}
    <div class="mock-review-nav">
      <button class="btn b-y" id="mockReviewNext">${i===TRIAL_MOCK.length-1?'해설 완료 · 결과 보기':'해설 확인 후 다음 문항 →'}</button>
    </div>
  </div>${renderToast()}`;
  requestAnimationFrame(()=>{
    const explanation=body.querySelector('.exp');
    if(explanation) explanation.scrollIntoView({behavior:'smooth',block:'start'});
  });
  $('#mockReviewNext').onclick=()=>{
    m.reviewIndex++;
    if(m.reviewIndex>=TRIAL_MOCK.length){
      m.reviewDone=true; state.trial.mockCompleted=true; writeTrialStatus(state.trial); saveTrialMockProgress();
      return mockResultView();
    }
    saveTrialMockProgress();
    mockReviewView();
  };
}
function mockResultView(){
  if(state.mock && state.mock.reviewDone){ state.trial.mockCompleted=true; writeTrialStatus(state.trial); saveTrialMockProgress(); }
  setTab('exam'); chrome('이번 학습진단',{progress:100,right:`해설 ${TRIAL_MOCK.length}/${TRIAL_MOCK.length} 완료`});

  body.innerHTML=`<div class="res"><div class="sc">${right}<small> / ${TRIAL_MOCK.length}</small></div><div class="msg"><b>무료 미니 모의고사 ${TRIAL_MOCK.length}문항의 해설까지 모두 확인했습니다.</b><br>이 결과는 이번 학습 세션의 진단이며 실제 시험 성적·합격 가능성이나 직무역량을 의미하지 않습니다.</div></div>

  <div class="center-note">설문 참여 여부와 관계없이 무료 학습 50문항과 미니 모의고사 50문항은 계속 이용할 수 있습니다. 개인별 정오답·점수·응시기록은 서버에 저장하지 않습니다.</div>${renderToast()}`;
  body.querySelector('[data-action="review"]').onclick=()=>{state.mock.reviewIndex=0;state.mock.reviewDone=false;saveTrialMockProgress();mockReviewView();};
  body.querySelector('[data-action="retry"]').onclick=()=>{clearTrialMockProgress();state.mock=null;newMockSession(true);mockView();};
  body.querySelector('[data-action="research"]').onclick=()=>go('research');
  body.querySelector('[data-action="home"]').onclick=()=>go('home');
}

async function pollSurveyCompletionAndOpen(attempt=0){
  if(IS_EXTRA_ROUTE || !free100Completed() || state.entitlement || state.statusBusy) return;
  state.statusBusy=true;
  try{
    const data=await jsonpApi('status');
    const result=handleAccessStatus(data);
    state.statusBusy=false;
    if(result.approved) return goExtraRoute();
    if(String(data.status||'').toUpperCase()==='SURVEY_REQUIRED' && attempt<7){
      return setTimeout(()=>pollSurveyCompletionAndOpen(attempt+1),1800);
    }
    if(state.view==='research') researchView(); else if(state.view==='home') homeView();
  }catch(e){
    state.statusBusy=false;
    if(attempt<3) return setTimeout(()=>pollSurveyCompletionAndOpen(attempt+1),2200);
  }
}

async function checkAccessStatusFromHome(openWhenApproved=false,button=null){
  if(state.statusBusy) return;
  if(!free100Completed()){
    state.homeStatus='무료 100문항을 모두 완료한 뒤 이용할 수 있습니다.';
    return IS_EXTRA_ROUTE?extraEntryView():homeView();
  }
  if(!state.accessCode) ensureAccessCode();
  state.statusBusy=true;
  const old=button&&button.innerHTML;
  if(button){ button.disabled=true; button.innerHTML='<span class="loading-dot">설문 제출 확인 중…</span>'; }
  try{
    const data=await jsonpApi('status');
    const result=handleAccessStatus(data);
    state.statusBusy=false;
    if(result.approved){
      if(openWhenApproved) return goExtraRoute();
      return IS_EXTRA_ROUTE?go('extraHome'):homeView();
    }
    if(IS_EXTRA_ROUTE) return extraEntryView();
    if(state.view==='research') return researchView();
    return homeView();
  }catch(e){
    state.statusBusy=false;
    state.homeStatus='설문 제출 여부를 확인하지 못했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.';
    if(IS_EXTRA_ROUTE) return extraEntryView();
    if(state.view==='research'){ state.statusMessage=state.homeStatus; return researchView(); }
    return homeView();
  }finally{
    if(button&&button.isConnected){ button.disabled=false; button.innerHTML=old; }
  }
}

function normalizeBasePlan(opts={}){
  const bp=readBaseProgress();
  const defaultStart=bp>=APP_CONFIG.baseQuestionCommitment?1:Math.max(1,bp+1);
  let start=Number(opts.start??defaultStart), end=Number(opts.end??APP_CONFIG.baseQuestionCommitment);
  start=Math.max(1,Math.min(APP_CONFIG.baseQuestionCommitment,Math.floor(start)||1));
  end=Math.max(1,Math.min(APP_CONFIG.baseQuestionCommitment,Math.floor(end)||APP_CONFIG.baseQuestionCommitment));
  if(start>end){ const t=start; start=end; end=t; }
  const excludeStudied=(opts.excludeStudied===undefined)?(bp<APP_CONFIG.baseQuestionCommitment):!!opts.excludeStudied;
  return {start,end,excludeStudied,depth:opts.depth==='advanced'?'advanced':'basic',custom:!!opts.custom};
}

async function launchProtected(button,tier='BASE',opts={}){
  if(state.protectedLaunching) return;
  state.protectedLaunching=true;
  const old=button&&button.innerHTML;

  try{ await startProtectedTier(tier,opts); }
  finally{
    state.protectedLaunching=false;
    if(button&&button.isConnected){button.disabled=false;button.innerHTML=old;}
  }
}
async function fetchProtectedWindow(tier,offset,plan,knownIds=new Set()){
  if(tier!=='BASE'){
    const r=await loadProtectedBatch(tier,offset);
    const raw=Array.isArray(r.questions)?r.questions:[];
    const items=raw.filter(q=>q&&(!q.id||!knownIds.has(q.id))).map((q,i)=>({question:q,isReview:false,number:offset+i+1}));
    const n=(r.nextOffset===null||r.nextOffset===undefined||r.nextOffset==='')?null:Number(r.nextOffset);
    return {items,nextOffset:(Number.isFinite(n)&&n>offset)?n:null,response:r};
  }
  let cur=Math.max(0,offset), guard=0;
  const studied=readBaseHistoryNumbers();
  while(cur<plan.end && guard++<20){
    const limit=Math.min(APP_CONFIG.contentBatchSize||10,plan.end-cur);
    const r=await loadProtectedBatch('BASE',cur,limit);
    const raw=Array.isArray(r.questions)?r.questions:[];
    const mapped=raw.map((q,i)=>({question:q,isReview:false,number:cur+i+1})).filter(x=>x.question&&x.number>=plan.start&&x.number<=plan.end);
    const items=mapped.filter(x=>(!x.question.id||!knownIds.has(x.question.id))&&(!plan.excludeStudied||!studied.has(x.number)));
    const parsed=(r.nextOffset===null||r.nextOffset===undefined||r.nextOffset==='')?null:Number(r.nextOffset);
    let next=(Number.isFinite(parsed)&&parsed>cur)?parsed:(raw.length?cur+raw.length:null);
    if(next!==null) next=Math.min(next,plan.end);
    if(items.length) return {items,nextOffset:(next!==null&&next<plan.end)?next:null,response:r};
    if(next===null||next<=cur||next>=plan.end) return {items:[],nextOffset:null,response:r};
    cur=next;
  }
  return {items:[],nextOffset:null,response:{}};
}

async function startProtectedTier(tier,opts={}){
  try{
    const manifest=await loadContentManifest(true);
    state.contentManifest=manifest;
    if(tier==='BASE' && !manifest.releaseReady){
      state.statusMessage=`추가 100문항의 법령·해설 검증이 완료된 뒤 공개됩니다. 현재 ${manifest.baseLoaded||0}/${manifest.baseRequired||100}문항입니다.`;
      return protectedLaunchErrorView(state.statusMessage,tier,opts);
    }
    if(tier==='EXTRA' && !state.extraAcknowledged) return go('extraNotice');
    if(tier==='EXTRA' && !(manifest.extraCount>0)){
      state.statusMessage='현재 서버에 등록된 추가 학습문항은 0문항입니다. 추가 100문항을 이용해 주세요.';
      return protectedLaunchErrorView(state.statusMessage,tier,opts);
    }
    if(tier==='BASE'){
      const plan=normalizeBasePlan(opts);
      const studied=readBaseHistoryNumbers();
      let target=0; for(let n=plan.start;n<=plan.end;n++) if(!plan.excludeStudied||!studied.has(n)) target++;
      if(target<=0) return baseRangeEmptyView(plan);
      const win=await fetchProtectedWindow('BASE',plan.start-1,plan,new Set());
      if(!win.items.length){ state.statusMessage='선택한 범위의 문제를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'; return protectedLaunchErrorView(state.statusMessage,tier,opts); }
      state.protected={tier:'BASE',plan,total:target,queue:win.items,index:0,sessionCompleted:0,nextOffset:win.nextOffset,answered:false,selected:null,loading:false,lastOffset:plan.start-1};
      return go('protected');
    }
    const win=await fetchProtectedWindow(tier,0,null,new Set());
    if(!win.items.length){ state.statusMessage='현재 이용 가능한 추가 학습문항이 없습니다.'; return protectedLaunchErrorView(state.statusMessage,tier,opts); }
    const expectedTotal=Number((win.response&&win.response.total)||manifest.extraCount||win.items.length||0);
    state.protected={tier,total:expectedTotal,queue:win.items,index:0,sessionCompleted:0,nextOffset:win.nextOffset,answered:false,selected:null,loading:false,lastOffset:0,plan:{depth:'basic'}};
    go('protected');
  }catch(e){
    state.statusMessage=e.message||'문제은행을 불러오지 못했습니다.';
    if(!state.entitlement){ state.homeStatus=state.statusMessage; state.statusMessage=''; return go('home'); }
    return protectedLaunchErrorView(state.statusMessage,tier,opts);
  }
}

async function protectedView(){
  setTab('learn');
  const s=state.protected;
  if(!s || !s.queue || !s.queue.length) return go('full');
  if(s.index>=s.queue.length){
    if(s.nextOffset!==null && s.nextOffset!==undefined && !s.loading){
      s.loading=true;
      try{
        const knownIds=new Set(s.queue.map(x=>x.question&&x.question.id).filter(Boolean));
        const win=await fetchProtectedWindow(s.tier,Number(s.nextOffset),s.plan,knownIds);
        s.loading=false;
        if(win.items.length){ s.queue.push(...win.items); s.nextOffset=win.nextOffset; }
        else s.nextOffset=null;
      }catch(e){
        s.loading=false;
        if(!state.entitlement && e.status){state.homeStatus=e.message;return go('home');}
        return protectedIncompleteView(e.message||'다음 문제를 불러오지 못했습니다.');
      }
    }
    if(s.index>=s.queue.length){
      if(s.tier==='BASE' && s.sessionCompleted<s.total) return protectedIncompleteView(`선택 범위 ${s.total}문항 중 ${s.sessionCompleted}문항만 확인되었습니다.`);
      return protectedEndView();
    }
  }
  const item=s.queue[s.index],q=item.question,isReview=!!item.isReview;
  const mode=s.plan&&s.plan.depth==='advanced'?'심화':'기본';
  const sessionNo=Math.min(s.sessionCompleted+1,s.total||1);
  const absoluteNo=s.tier==='BASE'?(item.number||sessionNo):sessionNo;
  const progress=s.total?Math.round(Math.min(s.sessionCompleted,s.total)/s.total*100):0;
  chrome(s.tier==='BASE'?'추가 100문항':'추가 학습',{showBack:true,progress,right:isReview?'복습 문항':(s.tier==='BASE'?`${mode} · ${absoluteNo}/100`:'추가 자료')});
  const rangeNote=s.tier==='BASE'&&s.plan?`<div class="session-range-note"><b>${s.plan.start}~${s.plan.end}번 · ${mode} 학습</b>${s.plan.excludeStudied?' · 이미 학습한 문항 제외':''}<br>이번 선택 범위 ${s.sessionCompleted}/${s.total} 완료 · 전체 연속 진도 ${readBaseProgress()}/100</div>`:'';
  body.innerHTML=`<div class="chatbg">${rangeNote}${isReview?'<div class="session-note"><b>복습 문항입니다.</b> 앞에서 ‘다시’ 또는 ‘어려움’으로 표시한 문제를 한 번 더 확인합니다. 새 문항 수에는 포함되지 않습니다.</div>':''}${questionBubble(q,s.tier==='BASE'?absoluteNo:sessionNo,s.tier==='BASE'?100:s.total,isReview?'복습':(s.tier==='BASE'?mode:'추가'))}${optionsHtml(q)}<div id="protectedAfter"></div></div>`;
  body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>answerProtected(+b.dataset.pick));
}
function answerProtected(pick){

  markLearnOptions(q.answer,pick); const ok=pick===q.answer;

function rateProtected(rate){
  const s=state.protected,item=s&&s.queue[s.index]; if(!s||!item)return;
  const isCore=!item.isReview;
  if((rate==='again'||rate==='hard')&&isCore){const gap=rate==='again'?2:5;const pos=Math.min(s.queue.length,s.index+gap);s.queue.splice(pos,0,{question:item.question,isReview:true,number:item.number});}
  if(isCore){
    s.sessionCompleted++;
    if(s.tier==='BASE') markBaseQuestionStudied(item.number);
  }
  s.index++;s.answered=false;s.selected=null;protectedView();
}

function render(){
  body.scrollTop=0;
  if(state.view==='extraEntry') extraEntryView();
  else if(state.view==='extraHome') extraHomeView();
  else if(state.view==='learn') studyView();
  else if(state.view==='exam') mockView();
  else if(state.view==='home') homeView();
  else if(state.view==='research') researchView();
  else if(state.view==='pending') pendingView();
  else if(state.view==='full') fullView();
  else if(state.view==='rangeSelect') rangeSelectView();
  else if(state.view==='extraNotice') extraNoticeView();

  else if(state.view==='info') infoView();

tabs.addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  const v=b.dataset.t;
  if(v==='learn'){
    if(state.entitlement) return go('rangeSelect');
    if(state.trial.studyCompleted){ clearTrialStudyProgress(); state.study=null; newStudySession(true); }
    else if(!state.study) state.study=loadTrialStudyProgress();
    go('learn');
  }
  else if(v==='exam'){
    if(state.trial.mockCompleted && state.mock && state.mock.submitted && !state.mock.reviewDone) return go('exam');
    if(state.trial.mockCompleted){ clearTrialMockProgress(); state.mock=null; newMockSession(true); }
    else if(!state.mock) state.mock=loadTrialMockProgress();
    go('exam');
  }
  else go(v);
});

  if(IS_EXTRA_ROUTE) return;
  if(free100Completed() && state.surveyStage==='opened' && !state.entitlement){
    setTimeout(()=>pollSurveyCompletionAndOpen(0),350);
  }
});
clearLegacyEntitlement();
render();

</script>
